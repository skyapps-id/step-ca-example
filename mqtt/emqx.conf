node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "/opt/emqx/data"
}

dashboard {
  listeners.http {
    bind = 18083
  }
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

listeners.wss.default {
  enable = false
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    # trust anchor untuk verifikasi CLIENT cert:
    # intermediate (melengkapi rantai dari client cert) + root (anchor-nya)
    cacertfile = "/opt/emqx/etc/certs/ca-chain.crt"
    # cert yang dikirim ke client saat handshake.
    # step CLI menyimpan cert dalam bentuk bundle (leaf + intermediate),
    # jadi emqx-server.crt saja sudah cukup sebagai fullchain.
    certfile = "/opt/emqx/etc/certs/emqx-server.crt"
    keyfile = "/opt/emqx/etc/certs/emqx-server.key"
    verify = verify_peer
    fail_if_no_peer_cert = true
  }
}

mqtt {
  peer_cert_as_username = cn
}
