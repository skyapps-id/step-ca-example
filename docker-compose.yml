name: step-ca

services:
  step-ca-init:
    image: smallstep/step-ca:${STEP_CA_VERSION:-latest}
    container_name: step-ca-init
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -f "$$STEPPATH/certs/root_ca.crt" ]; then
          mkdir -p "$$STEPPATH/secrets"
          if [ ! -s "$$STEPPATH/secrets/password" ]; then
            echo "Generating new CA password..."
            head -c 32 /dev/urandom | base64 > "$$STEPPATH/secrets/password"
          fi
          echo "Initializing step-ca..."
          step ca init \
            --name "$$CA_NAME" \
            --deployment-type standalone \
            --dns "$$CA_DNS" \
            --address ":9000" \
            --provisioner "$$CA_PROVISIONER" \
            --password-file "$$STEPPATH/secrets/password" \
            --remote-management
        else
          echo "CA already initialized, skipping init."
        fi
    environment:
      STEPPATH: /home/step
      CA_NAME: ${CA_NAME:-Step CA Local}
      CA_DNS: ${CA_DNS:-localhost}
      CA_PROVISIONER: ${CA_PROVISIONER:-admin}
    volumes:
      - ./data/step:/home/step

  step-ca:
    image: smallstep/step-ca:${STEP_CA_VERSION:-latest}
    container_name: step-ca
    depends_on:
      step-ca-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${CA_PORT:-9000}:9000"
    environment:
      STEPPATH: /home/step
    volumes:
      - ./data/step:/home/step
    healthcheck:
      # NB: the command is `step ca health`, NOT `step ca healthcheck`
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # one-shot: decrypt the provisioner encryptedKey from the CA → provisioner.jwk.json
  # for the dashboard. Idempotent: skips if the file already exists.
  jwk-init:
    image: smallstep/step-ca:${STEP_CA_VERSION:-latest}
    container_name: dashboard-jwk-init
    depends_on:
      step-ca:
        condition: service_healthy
    volumes:
      - ./dashboard/server/jwk:/out
      - ./data/step/secrets/password:/secrets/password:ro
      - ./data/step/certs/root_ca.crt:/ca/root_ca.crt:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /out/provisioner.jwk.json ]; then
          echo "provisioner.jwk.json already exists — skipping"
          exit 0
        fi
        LIST=$(step ca provisioner list --ca-url https://step-ca:9000 --root /ca/root_ca.crt)
        ENC=$(echo "$LIST" | sed -n 's/.*"encryptedKey":"\([^"]*\)".*/\1/p' | head -1)
        if [ -z "$ENC" ]; then
          echo "encryptedKey not found"
          exit 1
        fi
        echo "$ENC" | step crypto jwe decrypt --password-file /secrets/password > /out/provisioner.jwk.json
        echo "✓ provisioner.jwk.json generated automatically"

